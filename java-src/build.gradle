plugins {
    id 'java'
}

repositories { mavenCentral() }

def GAME_DIR = 'D:/Software/GameApp/steam/steamapps/common/ProjectZomboid'
def ZB_JAR   = "$GAME_DIR/ZombieBuddy.jar"
def PZ_JAR   = "$GAME_DIR/projectzomboid.jar"

def MOD_ID   = 'EmberRoutes'
def OUT_DIR  = file("../Contents/mods/${MOD_ID}/42/media/java/client")

dependencies {
    compileOnly files(ZB_JAR, PZ_JAR)
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'emberroutes.mainClasses', sourceSets.main.output.classesDirs.singleFile.absolutePath
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName.set(MOD_ID)
    archiveVersion.set('')
    archiveClassifier.set('')
}

tasks.register('generateLuaStubs') {
    description = 'Generate EmmyLua stubs for EmberRoutesJava (EmberRoutesBridge static methods).'
    def bridgeFile = file('src/main/java/emberroutes/EmberRoutesBridge.java')
    def outDir     = file('lua-stubs')
    def outFile    = new File(outDir, 'EmberRoutes_Java_Globals.lua')
    inputs.file(bridgeFile)
    outputs.file(outFile)

    doLast {
        def mapType = { String raw ->
            def t = raw.trim().replaceAll(/<[^<>]*>/, '').replace('...', '').trim()
            if (t.contains('[]')) return 'table'
            switch (t.tokenize('.').last()) {
                case 'void': return null
                case ~/String|char|Character/: return 'string'
                case ~/boolean|Boolean/: return 'boolean'
                case ~/int|long|float|double|short|byte|Integer|Long|Float|Double|Short|Byte|Number/: return 'number'
                case ~/KahluaTable|List|ArrayList|Map|Set/: return 'table'
                default: return 'any'
            }
        }
        def lines = [
            '---@meta',
            '-- Auto-generated by :generateLuaStubs - DO NOT EDIT.',
            '---@class EmberRoutesJava',
            'EmberRoutesJava = EmberRoutesJava or {}',
            ''
        ]
        if (bridgeFile.exists()) {
            def text = bridgeFile.getText('UTF-8')
            def methodRe = java.util.regex.Pattern.compile(
                'public\\s+static\\s+([A-Za-z_$][\\w.$<>\\[\\]]*)\\s+([A-Za-z_$][\\w$]*)\\s*\\(([^)]*)\\)')
            def m = methodRe.matcher(text)
            while (m.find()) {
                def retRaw = m.group(1)
                def name = m.group(2)
                def paramsRaw = m.group(3).trim()
                def sigParams = []
                if (paramsRaw) {
                    paramsRaw.split(',').each { p ->
                        def tok = p.trim().replaceAll(/\bfinal\s+/, '').split(/\s+/)
                        def pname = tok[-1]
                        def ptype = mapType(tok[0..-2].join(' '))
                        if (ptype) lines << "---@param ${pname} ${ptype}"
                        sigParams << pname
                    }
                }
                def ret = mapType(retRaw)
                if (ret) lines << "---@return ${ret}"
                lines << "function EmberRoutesJava.${name}(${sigParams.join(', ')}) end"
                lines << ''
            }
        }
        outDir.mkdirs()
        outFile.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('deploy', Copy) {
    dependsOn tasks.named('jar')
    from layout.buildDirectory.dir('libs')
    include "${MOD_ID}.jar"
    into OUT_DIR
    doLast {
        println "deployed -> ${new File(OUT_DIR, MOD_ID + '.jar')}"
    }
}

tasks.named('build') {
    finalizedBy 'deploy', 'generateLuaStubs'
}
